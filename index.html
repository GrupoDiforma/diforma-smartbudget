<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBudget Diforma | Minimalista</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <!-- FRANJA ROJA CORPORATIVA (Estilo Odoo Diforma) -->
  <div class="erp-top-bar">
    <i class="bi bi-grid-3x3-gap-fill me-2 fs-5"></i>
    <span class="fw-bold" style="font-size: 0.9rem; letter-spacing: 0.5px;">GRUPO DIFORMA S.A. - SmartBudget</span>
  </div>

  <div class="main-container">
    <div class="card mb-4 mt-2">
      
      <!-- HEADER GLOBAL MINIMALISTA -->
      <div class="card-header-main d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <div style="background-color: var(--diforma-red); color: white; padding: 6px 10px; border-radius: 8px;">
            <i class="bi bi-calculator-fill fs-5"></i>
          </div>
          <span class="fs-5 fw-bold" style="letter-spacing: -0.5px;">Presupuestos y Costos</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-outline-secondary btn-sm bg-white" onclick="alert('Panel Admin se migrará pronto')">
            <i class="bi bi-gear me-1"></i>Ajustes
          </button>
          <span class="badge badge-version px-2 py-1" id="appVersionBadge">V-Local</span>
          <span id="badgeTipo" class="badge badge-nacional px-2 py-1">NACIONAL</span>
        </div>
      </div>
      
      <div class="card-body p-4">
        <!-- NAVEGACIÓN PRINCIPAL (TABS) -->
        <ul class="nav nav-tabs mb-4" id="mainAppTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-ingenieria" data-bs-toggle="tab" data-bs-target="#pane-ingenieria" type="button" role="tab">
              Ingeniería de Costos
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-comercial" data-bs-toggle="tab" data-bs-target="#pane-comercial" type="button" role="tab" disabled>
              Comercial y Logística (Próximamente)
            </button>
          </li>
        </ul>

        <div class="tab-content" id="mainAppTabsContent">
          <!-- PESTAÑA 1: INGENIERÍA DE COSTOS -->
          <div class="tab-pane fade show active" id="pane-ingenieria" role="tabpanel">
            
            <!-- PASO 1: ODOO CRM -->
            <div class="mb-5">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0" style="color: var(--w11-text);"><span class="step-badge">1</span> Información del Proyecto</h6>
                <div class="d-flex gap-2">
                  <button class="btn btn-outline-secondary btn-sm bg-white"><i class="bi bi-clock-history me-1"></i>Historial</button>
                  <button class="btn btn-primary btn-sm"><i class="bi bi-cloud-check me-1"></i>Guardar Local</button>
                </div>
              </div>
              <div class="row g-3">
                <div class="col-md-3">
                  <label class="form-label">Oportunidad Odoo</label>
                  <div class="input-group input-group-sm">
                    <input type="text" id="inputCodigo" class="form-control" placeholder="Ej: 17652-A">
                    <button type="button" class="btn btn-outline-secondary bg-white"><i class="bi bi-search"></i></button>
                  </div>
                </div>
                <div class="col-md-3"><label class="form-label">No. Proyecto</label><input type="text" class="form-control form-control-sm" readonly value="PRE-001"></div>
                <div class="col-md-6"><label class="form-label">Cliente</label><input type="text" class="form-control form-control-sm" readonly value="Buscando cliente..."></div>
              </div>
            </div>

            <!-- PASO 3: MATRIZ COSTOS -->
            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0" style="color: var(--w11-text);"><span class="step-badge">2</span> Matriz de Costos Directos</h6>
                <div class="d-flex gap-2 align-items-center">
                  <button type="button" class="btn btn-outline-secondary btn-sm bg-white"><i class="bi bi-plus-lg me-1"></i>Fila Manual</button>
                </div>
              </div>
              <div class="table-responsive border rounded" style="background: var(--w11-card); border-color: var(--w11-border);">
                <table class="table table-hover table-items mb-0">
                  <thead id="theadItems">
                    <tr><th class="text-center py-4 text-muted" style="background: white; border: none; font-weight: 400;">La matriz conectada a IndexedDB se renderizará aquí</th></tr>
                  </thead>
                  <tbody id="tbodyItems"></tbody>
                </table>
              </div>
            </div>

          </div> 
        </div> 
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="js/core/app.js"></script>
<script src="js/core/simulador.js"></script>
</body>
</html>
